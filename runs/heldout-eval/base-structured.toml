model = "fugu-base"
num_tasks = 60
num_rollouts = 2
shuffle = false
max_concurrent = 4
push = false
output_dir = "/vePFS-Mindverse/share/richard/open-fugu-ultra/runs/heldout-eval/base-structured-v2"

[client]
type = "eval"
base_url = "http://127.0.0.1:18000/v1"
api_key_var = "OPENFUGU_WORKER_KEY"

[env]
id = "open-fugu-env"

[env.taskset]
id = "open-fugu-env"
source = "manifest"
manifest_path = "/vePFS-Mindverse/share/richard/open-fugu-ultra/data/phase_a/heldout_eval_manifest.jsonl"
samples = 60
seed = 17

[env.orchestrator.harness]
id = "null"
[env.orchestrator.sampling]
max_tokens = 12288
temperature = 0.7
extra_body = { chat_template_kwargs = { enable_thinking = true }, structured_outputs = { json = { type = "object", properties = { steps = { type = "array", minItems = 1, maxItems = 5, items = { type = "object", properties = { id = { type = "integer", minimum = 1 }, subtask = { type = "string", minLength = 1 }, worker = { type = "string", enum = ["worker_a", "worker_b", "worker_c"] }, access = { type = "array", items = { type = "integer" } } }, required = ["id", "subtask", "worker", "access"], additionalProperties = false } } }, required = ["steps"], additionalProperties = false } } }

[sampling]
max_tokens = 12288
temperature = 0.7
chat_template_kwargs = { enable_thinking = true }
structured_outputs = { json = { type = "object", properties = { steps = { type = "array", minItems = 1, maxItems = 5, items = { type = "object", properties = { id = { type = "integer", minimum = 1 }, subtask = { type = "string", minLength = 1 }, worker = { type = "string", enum = ["worker_a", "worker_b", "worker_c"] }, access = { type = "array", items = { type = "integer" } } }, required = ["id", "subtask", "worker", "access"], additionalProperties = false } } }, required = ["steps"], additionalProperties = false } } 
